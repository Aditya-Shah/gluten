  - id: cow-write-merge-multi-when-matched
    feature: cow-write
    operation: merge-multi-when-matched
    dtype: int
    expected: fallback
    upstream_claim: yes
    config:
      "spark.gluten.sql.columnar.backend.velox.delta.enableNativeWrite": "true"
    setup_sql: |
      CREATE TABLE cov_mwm_t (id INT, v INT, status STRING) USING delta
        TBLPROPERTIES ('delta.enableDeletionVectors' = 'false');
      INSERT INTO cov_mwm_t VALUES (1, 10, 'active'), (2, 20, 'archived'), (3, 30, 'active');
      CREATE TABLE cov_mwm_s (id INT, v INT) USING delta;
      INSERT INTO cov_mwm_s VALUES (1, 100), (2, 200), (3, 300);
    query_sql: |
      MERGE INTO cov_mwm_t t USING cov_mwm_s s ON t.id = s.id
      WHEN MATCHED AND t.status = 'archived' THEN DELETE
      WHEN MATCHED AND t.status = 'active' THEN UPDATE SET v = s.v
      WHEN NOT MATCHED THEN INSERT (id, v, status) VALUES (s.id, s.v, 'active');
    teardown_sql: |
      DROP TABLE cov_mwm_t;
      DROP TABLE cov_mwm_s;

  - id: cow-write-update-with-case-when
    feature: cow-write
