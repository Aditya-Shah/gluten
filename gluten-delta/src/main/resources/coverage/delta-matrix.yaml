      "spark.gluten.sql.columnar.backend.velox.delta.enableNativeWrite": "true"
    setup_sql: |
      CREATE TABLE cov_mcte_t (id INT, v STRING) USING delta
        TBLPROPERTIES ('delta.enableDeletionVectors' = 'false');
      INSERT INTO cov_mcte_t VALUES (1, 'a'), (2, 'b');
      CREATE TABLE cov_mcte_s (id INT, v STRING) USING delta;
      INSERT INTO cov_mcte_s VALUES (2, 'B'), (3, 'C'), (4, 'D');
    query_sql: |
      MERGE INTO cov_mcte_t t
      USING (SELECT id, v FROM cov_mcte_s WHERE id > 2) s
        ON t.id = s.id
      WHEN MATCHED THEN UPDATE SET v = s.v
      WHEN NOT MATCHED THEN INSERT (id, v) VALUES (s.id, s.v);
    teardown_sql: |
      DROP TABLE cov_mcte_t;
      DROP TABLE cov_mcte_s;

