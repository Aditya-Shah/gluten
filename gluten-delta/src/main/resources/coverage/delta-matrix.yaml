# ============================================================================
# Window function variants
# ============================================================================

  - id: cow-read-window-lag
    feature: cow-read
    operation: window-lag
    dtype: int
    expected: native
    upstream_claim: yes
    setup_sql: |
      CREATE TABLE cov_w_lag (k STRING, ts INT, v INT) USING delta;
      INSERT INTO cov_w_lag VALUES ('a', 1, 10), ('a', 2, 20), ('a', 3, 30), ('b', 1, 100);
    query_sql: |
      SELECT k, ts, v, lag(v, 1) OVER (PARTITION BY k ORDER BY ts) AS prev FROM cov_w_lag;
    teardown_sql: |
      DROP TABLE cov_w_lag;

  - id: cow-read-window-rank
    feature: cow-read
    operation: window-rank
    dtype: int
    expected: native
    upstream_claim: yes
    setup_sql: |
      CREATE TABLE cov_w_rank (k STRING, score INT) USING delta;
      INSERT INTO cov_w_rank VALUES ('a', 90), ('a', 90), ('a', 80), ('b', 95), ('b', 70);
    query_sql: |
      SELECT k, score,
        rank() OVER (PARTITION BY k ORDER BY score DESC) AS r,
        dense_rank() OVER (PARTITION BY k ORDER BY score DESC) AS dr
      FROM cov_w_rank;
    teardown_sql: |
      DROP TABLE cov_w_rank;

  - id: cow-read-window-running-sum
    feature: cow-read
    operation: window-running-sum
    dtype: int
    expected: native
    upstream_claim: yes
    setup_sql: |
      CREATE TABLE cov_w_rs (k STRING, ts INT, v INT) USING delta;
      INSERT INTO cov_w_rs VALUES ('a', 1, 10), ('a', 2, 20), ('a', 3, 30);
    query_sql: |
      SELECT k, ts, v,
        sum(v) OVER (PARTITION BY k ORDER BY ts ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS running
      FROM cov_w_rs;
    teardown_sql: |
      DROP TABLE cov_w_rs;

