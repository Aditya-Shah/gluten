      "spark.gluten.sql.columnar.backend.velox.delta.enableNativeWrite": "true"
    setup_sql: |
      CREATE TABLE cov_ucw (id INT, v INT) USING delta;
      INSERT INTO cov_ucw VALUES (1, 10), (2, 20), (3, 30);
    query_sql: |
      UPDATE cov_ucw SET v = CASE WHEN v < 15 THEN 0 WHEN v < 25 THEN 50 ELSE 100 END;
    teardown_sql: |
      DROP TABLE cov_ucw;

